<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana Özel ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="hero">

    <div class="title-area">
      <span class="small-title">SANA ÖZEL ♡</span>

      <h1>
        Sen, benim<br>
        en güzel hikâyemsin
      </h1>

      <div class="title-line">
        <span></span>
        ♥
        <span></span>
      </div>

      <p>
        İyi ki varsın, iyi ki benimlesin.<br>
        Her gün seninle daha güzel.
      </p>
    </div>


    <section class="heart-stage">

      <div id="leftStream" class="heart-stream left-stream"></div>
      <div id="rightStream" class="heart-stream right-stream"></div>

      <div class="center-heart">
        <div class="letter-a">A</div>
      </div>

    </section>


    <button id="loveButton">
      ♥ Kalbime Dokun
    </button>


    <section class="love-message" id="loveMessage">

      <div class="moon">☾</div>

      <p>
        Ay ışığının altında,<br><br>

        Karanlığım ve aydınlığım olman,<br>
        her şeyim anlamına gelmen,<br>
        eşsizliğini anlatıyor bitanem.
      </p>

      <div class="message-heart">♥</div>

    </section>

  </main>


  <div id="floatingHearts"></div>

  <script src="script.js"></script>

</body>
</html>
