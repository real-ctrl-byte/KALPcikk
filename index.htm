<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sana Özel ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <div class="stars"></div>


  <main class="hero">

    <div class="top-text">
      SANA ÖZEL ♡
    </div>


    <div class="moon">
      ☾
    </div>


    <h1>
      Sen, benim<br>
      en güzel hikâyemsin
    </h1>


    <p class="subtitle">
     Bu arada çok güzelsin ve saçın harika olmuş.<br>
Bunu okuduğunda omzuma bir elini koysanaa 🐱
    </p>


    <!-- KALP ALANI -->

    <div class="heart-area">

      <div class="side-glow left-glow"></div>
      <div class="side-glow right-glow"></div>

      <div id="heartParticles"></div>

      <div class="center-letter">
        A
      </div>

    </div>


    <!-- BUTON -->

    <button id="loveButton">
      ❤️ Kalbime Dokun
    </button>


    <!-- ROMANTİK MESAJ -->

    <div id="loveMessage" class="love-message">

      <div class="message-moon">
        ☾
      </div>

      <p>
        Ay ışığının altında,<br><br>
        Karanlığım ve aydınlığım olman,<br>
        her şeyim anlamına gelmen,<br>
        eşsizliğini anlatıyor bitanem.
      </p>

      <div class="message-heart">
        ♥
      </div>

    </div>

  </main>



  <!-- DOKUNUNCA AÇILAN YAZI KUTUSU -->

  <div id="touchMessageBox" class="touch-message-box">

    <div class="touch-card">

      <button id="closeTouchBox" class="close-touch">
        ×
      </button>

      <h2>
        Bir şey yaz ❤️
      </h2>

      <textarea
        id="touchInput"
        placeholder="İstediğini buraya yaz..."
        maxlength="120"
      ></textarea>

      <button id="placeMessageButton">
        Kalbe Yaz 💗
      </button>

    </div>

  </div>


  <!-- YAZILAN MESAJLAR -->

  <div id="writtenMessages"></div>


  <!-- ARKA PLAN KALPLERİ -->

  <div id="backgroundHearts"></div>


  <script src="script.js"></script>

</body>

</html>
