<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana Özel ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stars"></div>

  <main class="hero">

    <div class="top-text">SANA ÖZEL ♡</div>

    <div class="moon">☾</div>

    <h1>
      Sen, benim<br>
      en güzel hikâyemsin
    </h1>

    <p class="subtitle">
      İyi ki varsın, iyi ki benimlesin.<br>
      Her gün seninle daha güzel.
    </p>

    <div class="heart-area">

      <div id="leftHearts"></div>
      <div id="rightHearts"></div>

      <div class="center-letter">A</div>

    </div>

    <button id="loveButton">
      ❤️ Kalbime Dokun
    </button>

    <div id="loveMessage" class="love-message">
      <div class="message-moon">☾</div>

      <p>
        Ay ışığının altında,<br><br>
        Karanlığım ve aydınlığım olman,<br>
        her şeyim anlamına gelmen,<br>
        eşsizliğini anlatıyor bitanem.
      </p>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
