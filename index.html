<!DOCTYPE html>
<html lang="tr">
<head>

  <title>Sana Özel ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay"></div>

  <main class="hero">
    <div class="card">
      <div class="flower">🌸</div>

      <h1>Sana Özel ❤️</h1>

      <p class="message">
        Hayatıma kattığın her güzel an için teşekkür ederim.

      </p>

      <div class="lilies">
        🌺 🌸 🌺
      </div>

      <button id="loveButton">
        Kalbime Dokun ❤️
      </button>

      <p id="secretMessage" class="secret-message">
        Seni çok seviyorum ❤️
      </p>
    </div>
  </main>

  <div id="heart-container"></div>

  <script src="script.js"></script>
</body>
</html>
